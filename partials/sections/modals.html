{{#each modals}}
  <dialog class="modal js-dialog-modal" id="{{id}}" aria-labelledby="{{id}}-title">
    <div class="modal__panel">
      <div class="modal__head">
        <h2 class="modal__title" id="{{id}}-title">{{title}}</h2>

        <button class="modal__close js-dialog-close" type="button" aria-label="Закрыть модальное окно">
          <svg class="modal__close-icon" width="21" height="21" aria-hidden="true" focusable="false">
            <use href="#modal-close"></use>
          </svg>
        </button>
      </div>

      <p class="modal__description">{{description}}</p>

      <form class="modal__form js-form" action="#" method="post">
        <input type="hidden" name="form" value="{{formName}}">

        <div class="modal__fields">
          {{#each fields}}
            {{> components/text-field }}
          {{/each}}
        </div>

        {{> components/button
          class="modal__submit btn--full"
          type="submit"
          label=submitLabel
        }}

        <div class="modal__agreements">
          {{#each agreements}}
            {{> components/checkbox }}
          {{/each}}
        </div>
      </form>
    </div>
  </dialog>
{{/each}}
